name: Max Speed DTB Extractor & Touchscreen Scanner

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to Xiaomi Pad 6 ROM (.tgz or .zip)'
        required: true
        default: 'https://bn.d.miui.com/OS2.0.14.0.UMZINXM/pipa_in_global-ota_full-OS2.0.14.0.UMZINXM-user-14.0-00783b8e7f.zip'

jobs:
  fast-dtb-scan:
    name: Download, Extract & Scan DTB
    runs-on: ubuntu-22.04
    steps:
      - name: Install Max Speed Utilities
        run: |
          echo "Installing aria2c (multi-thread downloader) and Device Tree Compiler..."
          sudo apt-get update -y
          sudo apt-get install -y aria2 device-tree-compiler python3 git

      - name: Targeted Download and Extraction (vendor_boot)
        run: |
          ROM_URL="${{ github.event.inputs.rom_url }}"
          
          if [[ "$ROM_URL" == *.tgz ]] || [[ "$ROM_URL" == *.tar.gz ]]; then
            echo "Fastboot ROM detected (.tgz). Downloading..."
            aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.tgz
            
            echo "Ripping out vendor_boot.img directly from TGZ..."
            tar -xf rom.tgz --wildcards '*/vendor_boot.img'
            find . -name "vendor_boot.img" -exec mv {} ./vendor_boot.img \;
            
          elif [[ "$ROM_URL" == *.zip ]]; then
            echo "Recovery ROM detected (.zip). Downloading..."
            aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.zip
            
            echo "Setting up payload-dumper-go..."
            go install github.com/ssut/payload-dumper-go@latest
            export PATH=$PATH:$(go env GOPATH)/bin
            
            echo "Extracting vendor_boot.img from payload.bin inside rom.zip..."
            payload-dumper-go -p vendor_boot rom.zip
            
            echo "Moving vendor_boot.img to root workspace..."
            find extracted_* -name "vendor_boot.img" -exec mv {} ./vendor_boot.img \;
            
          else
            echo "Error: Unsupported URL format. Must end in .tgz, .tar.gz, or .zip"
            exit 1
          fi
          
          if [ ! -f "vendor_boot.img" ]; then
            echo "Error: vendor_boot.img not found!"
            exit 1
          fi

      - name: Unpack vendor_boot.img and Isolate DTB
        run: |
          echo "Fetching official Google mkbootimg repository..."
          git clone -q https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools
          
          echo "Unpacking vendor boot image headers and payloads..."
          mkdir -p out
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img vendor_boot.img --out out
          
          if [ -f "out/dtb" ]; then
            mv out/dtb extracted.dtb
          elif [ -f "out/vendor_boot.img-dtb" ]; then
            mv out/vendor_boot.img-dtb extracted.dtb
          else
            echo "Error: DTB payload not found inside vendor_boot!"
            exit 1
          fi

      - name: Decompile DTB to Human-Readable DTS
        run: |
          echo "Decompiling Device Tree Blob into DTS text format..."
          dtc -I dtb -O dts -o pipa-device-tree.dts extracted.dtb

      - name: Auto-Scan DTS for Touchscreen Coordinates
        run: |
          echo "=================================================="
          echo "    AUTOMATIC TOUCHSCREEN HARDWARE SCAN           "
          echo "=================================================="
          
          echo "Searching for Novatek NT36532 and other specific controllers..."
          
          # Highly specific regex to avoid 'stats@' and specifically target the Novatek controller
          grep -iE -A 40 -B 5 "nt36|novatek|touchscreen@" pipa-device-tree.dts > touch_results.txt || true
          
          if [ -s touch_results.txt ]; then
            echo "[+] Touchscreen data found! Here are the hardware coordinates to use in your ACPI tables:"
            echo "--------------------------------------------------"
            cat touch_results.txt
            echo "--------------------------------------------------"
          else
            echo "[-] Could not automatically find the touchscreen keywords."
          fi
