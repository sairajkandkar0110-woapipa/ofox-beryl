name: Max Speed DTB Extractor & Touchscreen Scanner

on:
  workflow_dispatch:

jobs:
  fast-dtb-scan:
    name: Download, Extract & Scan DTB
    runs-on: ubuntu-22.04
    steps:
      - name: Install Max Speed Utilities
        run: |
          echo "Installing aria2c (multi-thread downloader) and Device Tree Compiler..."
          sudo apt-get update -y
          sudo apt-get install -y aria2 device-tree-compiler python3

      - name: Multi-Threaded ROM Download
        run: |
          echo "Downloading Xiaomi Pad 6 Fastboot ROM using 16 concurrent threads..."
          ROM_URL="https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V14.0.4.0.TMZMIXM/pipa_global_images_V14.0.4.0.TMZMIXM_20230614.0000.00_13.0_global_8fb7b2339b.tgz"
          
          aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.tgz

      - name: Targeted Extraction (boot.img only)
        run: |
          echo "Bypassing full extraction. Ripping out only boot.img directly from the archive..."
          # The wildcard ensures tar only pulls files ending in 'boot.img', skipping system and vendor images
          tar -xf rom.tgz --wildcards '*/boot.img'
          
          echo "Moving boot.img to root workspace..."
          find . -name "boot.img" -exec mv {} ./boot.img \;
          
          if [ ! -f "boot.img" ]; then
            echo "Error: boot.img not found!"
            exit 1
          fi

      - name: Unpack boot.img and Isolate DTB
        run: |
          echo "Fetching Android boot image unpacker..."
          wget -q https://raw.githubusercontent.com/cfig/Android_boot_image_editor/master/unpack_bootimg.py
          chmod +x unpack_bootimg.py
          
          echo "Unpacking boot image headers and payloads..."
          python3 unpack_bootimg.py --boot_img boot.img
          
          # Locate the device tree blob
          if [ -f "boot.img-dtb" ]; then
            mv boot.img-dtb extracted.dtb
          elif [ -f "out/dtb" ]; then
            mv out/dtb extracted.dtb
          else
            echo "Error: DTB payload not found!"
            exit 1
          fi

      - name: Decompile DTB to Human-Readable DTS
        run: |
          echo "Decompiling Device Tree Blob into DTS text format..."
          dtc -I dtb -O dts -o pipa-device-tree.dts extracted.dtb

      - name: Auto-Scan DTS for Touchscreen Coordinates
        run: |
          echo "=================================================="
          echo "    AUTOMATIC TOUCHSCREEN HARDWARE SCAN           "
          echo "=================================================="
          
          echo "Searching for I2C/SPI touch controllers (Novatek, Goodix, Focaltech, Synaptics, etc.)..."
          
          # Grep will pull the matching keyword, plus the 5 lines before it and 35 lines after it to capture the entire hardware block (pins, bus address, resolution).
          grep -iE -A 35 -B 5 "touchscreen|goodix|novatek|focaltech|synaptics|fts|ts@" pipa-device-tree.dts > touch_results.txt || true
          
          if [ -s touch_results.txt ]; then
            echo "[+] Touchscreen data found! Here are the hardware coordinates to use in your ACPI tables:"
            echo "--------------------------------------------------"
            cat touch_results.txt
            echo "--------------------------------------------------"
          else
            echo "[-] Could not automatically find standard touchscreen keywords."
            echo "You may need to manually search the .dts file for the 'spi' or 'i2c' bus sections."
          fi
