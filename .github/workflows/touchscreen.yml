name: Max Speed DTB Extractor & Touchscreen Scanner

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to Xiaomi Pad 6 ROM (.tgz or .zip)'
        required: true

jobs:
  fast-dtb-scan:
    name: Download, Extract & Scan DTB
    runs-on: ubuntu-22.04
    steps:
      - name: Install Max Speed Utilities
        run: |
          echo "Installing aria2c (multi-thread downloader) and Device Tree Compiler..."
          sudo apt-get update -y
          sudo apt-get install -y aria2 device-tree-compiler python3 git

      - name: Targeted Download and Extraction
        run: |
          ROM_URL="${{ github.event.inputs.rom_url }}"
          
          if [[ "$ROM_URL" == *.tgz ]] || [[ "$ROM_URL" == *.tar.gz ]]; then
            echo "Fastboot ROM detected (.tgz). Downloading..."
            aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.tgz
            
            echo "Ripping out boot.img directly from TGZ..."
            tar -xf rom.tgz --wildcards '*/boot.img'
            find . -name "boot.img" -exec mv {} ./boot.img \;
            
          elif [[ "$ROM_URL" == *.zip ]]; then
            echo "Recovery ROM detected (.zip). Downloading..."
            aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.zip
            
            echo "Setting up payload-dumper-go..."
            go install github.com/ssut/payload-dumper-go@latest
            export PATH=$PATH:$(go env GOPATH)/bin
            
            echo "Extracting boot.img from payload.bin inside rom.zip..."
            payload-dumper-go -p boot rom.zip
            
            echo "Moving boot.img to root workspace..."
            find extracted_* -name "boot.img" -exec mv {} ./boot.img \;
            
          else
            echo "Error: Unsupported URL format. Must end in .tgz, .tar.gz, or .zip"
            exit 1
          fi
          
          if [ ! -f "boot.img" ]; then
            echo "Error: boot.img not found!"
            exit 1
          fi

      - name: Unpack boot.img and Isolate DTB
        run: |
          echo "Fetching official Google mkbootimg repository..."
          git clone -q https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools
          
          echo "Unpacking boot image headers and payloads..."
          mkdir -p out
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img boot.img --out out
          
          if [ -f "out/dtb" ]; then
            mv out/dtb extracted.dtb
          elif [ -f "out/boot.img-dtb" ]; then
            mv out/boot.img-dtb extracted.dtb
          else
            echo "Error: DTB payload not found!"
            exit 1
          fi

      - name: Decompile DTB to Human-Readable DTS
        run: |
          echo "Decompiling Device Tree Blob into DTS text format..."
          dtc -I dtb -O dts -o pipa-device-tree.dts extracted.dtb

      - name: Auto-Scan DTS for Touchscreen Coordinates
        run: |
          echo "=================================================="
          echo "    AUTOMATIC TOUCHSCREEN HARDWARE SCAN           "
          echo "=================================================="
          
          echo "Searching for I2C/SPI touch controllers (Novatek, Goodix, Focaltech, Synaptics, etc.)..."
          
          grep -iE -A 35 -B 5 "touchscreen|goodix|novatek|focaltech|synaptics|fts|ts@" pipa-device-tree.dts > touch_results.txt || true
          
          if [ -s touch_results.txt ]; then
            echo "[+] Touchscreen data found! Here are the hardware coordinates to use in your ACPI tables:"
            echo "--------------------------------------------------"
            cat touch_results.txt
            echo "--------------------------------------------------"
          else
            echo "[-] Could not automatically find standard touchscreen keywords."
            echo "You may need to manually search the .dts file for the 'spi' or 'i2c' bus sections."
          fi
