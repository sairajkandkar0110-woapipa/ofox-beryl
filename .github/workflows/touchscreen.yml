name: Max Speed DTBO Extractor & Release Uploader

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to Xiaomi Pad 6 ROM (.zip)'
        required: true
        default: 'https://bn.d.miui.com/OS2.0.14.0.UMZINXM/pipa_in_global-ota_full-OS2.0.14.0.UMZINXM-user-14.0-00783b8e7f.zip'

# CRITICAL: This grants the workflow permission to create a Release in your repo
permissions:
  contents: write

jobs:
  dtbo-decompile-release:
    name: Download, Extract, Scan & Release
    runs-on: ubuntu-22.04
    steps:
      - name: Install Utilities
        run: |
          echo "Installing aria2c, dtc, and zip..."
          sudo apt-get update -y
          sudo apt-get install -y aria2 device-tree-compiler python3 git zip

      - name: Download ROM & Extract dtbo.img
        run: |
          ROM_URL="${{ github.event.inputs.rom_url }}"
          
          echo "Downloading Recovery ROM..."
          aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.zip
          
          echo "Setting up payload-dumper-go..."
          go install github.com/ssut/payload-dumper-go@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          echo "Extracting ONLY dtbo.img to save time..."
          payload-dumper-go -p dtbo rom.zip
          
          echo "Moving dtbo.img to root workspace..."
          find extracted_* -name "dtbo.img" -exec mv {} ./dtbo.img \;

      - name: Split DTBO Container
        run: |
          echo "Fetching official Google libufdt repository..."
          git clone -q https://android.googlesource.com/platform/system/libufdt
          
          echo "Splitting dtbo.img into individual overlay blobs..."
          mkdir -p dtbo_blobs
          python3 libufdt/utils/src/mkdtboimg.py dump dtbo.img -b dtbo_blobs/overlay_

      - name: Decompile Overlays to DTS
        run: |
          echo "Decompiling each overlay into human-readable text..."
          mkdir -p dts_files
          for file in dtbo_blobs/*; do
            filename=$(basename "$file")
            dtc -I dtb -O dts -o "dts_files/${filename}.dts" "$file" 2>/dev/null || true
          done

      - name: Trace Parent SPI Bus Target & Package Files
        run: |
          echo "=================================================="
          echo "    SPI BUS PARENT TRACER & ZIPPER                "
          echo "=================================================="
          
          # Trace the target
          grep -iE -B 20 "novatek@0 \{" dts_files/*.dts > spi_target_trace.txt || true
          
          # Print the trace to the log for quick reading
          cat spi_target_trace.txt || true
          
          # Zip all the DTS files and the text trace into a single archive for the release
          echo "Zipping files for GitHub Release..."
          zip -r pipa_decompiled_dtbos.zip dts_files/ spi_target_trace.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically generates a unique tag based on the run number (e.g., dtbo-scan-15)
          tag_name: dtbo-scan-${{ github.run_number }}
          name: "Touchscreen DTBO Scan #${{ github.run_number }}"
          body: |
            Automated extraction and decompilation of DTBO overlays for Xiaomi Pad 6 (`pipa`).
            
            **Source ROM Used:**
            ${{ github.event.inputs.rom_url }}
            
            **Contents:**
            - `pipa_decompiled_dtbos.zip`: Contains all individual `.dts` overlay files.
            - `spi_target_trace.txt`: The targeted log searching for the Novatek SPI parent bus.
          files: |
            pipa_decompiled_dtbos.zip
            spi_target_trace.txt
