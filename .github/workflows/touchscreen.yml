name: Max Speed DTBO Extractor & Decompiler

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to Xiaomi Pad 6 ROM (.zip)'
        required: true
        default: 'https://bn.d.miui.com/OS2.0.14.0.UMZINXM/pipa_in_global-ota_full-OS2.0.14.0.UMZINXM-user-14.0-00783b8e7f.zip'

jobs:
  dtbo-decompile:
    name: Download, Extract & Decompile DTBO
    runs-on: ubuntu-22.04
    steps:
      - name: Install Utilities
        run: |
          echo "Installing aria2c and dtc..."
          sudo apt-get update -y
          sudo apt-get install -y aria2 device-tree-compiler python3 git

      - name: Download ROM & Extract dtbo.img
        run: |
          ROM_URL="${{ github.event.inputs.rom_url }}"
          
          echo "Downloading Recovery ROM..."
          aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.zip
          
          echo "Setting up payload-dumper-go..."
          go install github.com/ssut/payload-dumper-go@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          echo "Extracting ONLY dtbo.img to save time..."
          payload-dumper-go -p dtbo rom.zip
          
          echo "Moving dtbo.img to root workspace..."
          find extracted_* -name "dtbo.img" -exec mv {} ./dtbo.img \;

      - name: Split DTBO Container
        run: |
          echo "Fetching Android's official mkdtboimg.py tool..."
          wget -q https://raw.githubusercontent.com/aosp-mirror/platform_system_libufdt/master/utils/src/mkdtboimg.py
          chmod +x mkdtboimg.py
          
          echo "Splitting dtbo.img into individual overlay blobs..."
          mkdir -p dtbo_blobs
          python3 mkdtboimg.py dump dtbo.img -b dtbo_blobs/overlay_

      - name: Decompile Overlays to DTS
        run: |
          echo "Decompiling each overlay into human-readable text..."
          mkdir -p dts_files
          for file in dtbo_blobs/*; do
            filename=$(basename "$file")
            # Decompile and suppress warnings since overlays often lack base references
            dtc -I dtb -O dts -o "dts_files/${filename}.dts" "$file" 2>/dev/null || true
          done

      - name: Auto-Scan for Novatek GPIO Pins
        run: |
          echo "=================================================="
          echo "    NOVATEK TOUCHSCREEN PIN SCANNER               "
          echo "=================================================="
          
          # Search specifically for the SPI bus identifier and print the whole block
          grep -iE -A 40 -B 5 "novatek,NVT-ts-spi|novatek@0" dts_files/*.dts > novatek_hardware_pins.txt || true
          
          if [ -s novatek_hardware_pins.txt ]; then
            echo "[+] Novatek hardware block with integers found! Here are the pins:"
            echo "--------------------------------------------------"
            cat novatek_hardware_pins.txt
            echo "--------------------------------------------------"
          else
            echo "[-] Auto-scan didn't catch the integer block. Please check the artifact manually."
          fi

      - name: Upload DTBO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pipa-Decompiled-DTBOs
          path: |
            dts_files/
            novatek_hardware_pins.txt
