name: Max Speed DTB Extractor & Touchscreen Scanner

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct link to Xiaomi Pad 6 ROM (.zip)'
        required: true
        default: 'https://bn.d.miui.com/OS2.0.14.0.UMZINXM/pipa_in_global-ota_full-OS2.0.14.0.UMZINXM-user-14.0-00783b8e7f.zip'

jobs:
  fast-dtb-scan:
    name: Download, Extract & Scan DTB
    runs-on: ubuntu-22.04
    steps:
      - name: Install Max Speed Utilities
        run: |
          echo "Installing aria2c and Device Tree Compiler..."
          sudo apt-get update -y
          sudo apt-get install -y aria2 device-tree-compiler python3 git

      - name: Targeted Download and Extraction (vendor_boot & dtbo)
        run: |
          ROM_URL="${{ github.event.inputs.rom_url }}"
          
          echo "Downloading Recovery ROM (.zip)..."
          aria2c -x 16 -s 16 -j 16 -k 1M -V "$ROM_URL" -o rom.zip
          
          echo "Setting up payload-dumper-go..."
          go install github.com/ssut/payload-dumper-go@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          
          echo "Extracting vendor_boot.img AND dtbo.img from payload..."
          # The -p flag now targets both partitions simultaneously
          payload-dumper-go -p vendor_boot,dtbo rom.zip
          
          echo "Moving images to root workspace..."
          find extracted_* -name "vendor_boot.img" -exec mv {} ./vendor_boot.img \;
          find extracted_* -name "dtbo.img" -exec mv {} ./dtbo.img \;

      - name: Unpack vendor_boot.img and Isolate DTB
        run: |
          echo "Fetching official Google mkbootimg repository..."
          git clone -q https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools
          
          echo "Unpacking vendor boot image..."
          mkdir -p out
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img vendor_boot.img --out out
          
          if [ -f "out/dtb" ]; then
            mv out/dtb extracted.dtb
          elif [ -f "out/vendor_boot.img-dtb" ]; then
            mv out/vendor_boot.img-dtb extracted.dtb
          fi

      - name: Decompile DTB to Human-Readable DTS
        run: |
          echo "Decompiling Device Tree Blob into DTS text format..."
          dtc -I dtb -O dts -o pipa-device-tree.dts extracted.dtb || true

      - name: Deep Scan for Touch Controller
        run: |
          echo "=================================================="
          echo "    DEEP TOUCHSCREEN HARDWARE SCAN                "
          echo "=================================================="
          
          echo "1. Scanning vendor_boot DTS for OEM specific touch strings..."
          grep -iE -A 35 -B 5 "xiaomi,touch|touch|goodix|novatek|nt36|focaltech|synaptics|fts" pipa-device-tree.dts > touch_results.txt || true
          
          echo "2. Scanning DTBO (Device Tree Overlays) raw strings..."
          # Running strings against the raw DTBO to catch hardware identifiers
          strings dtbo.img | grep -iE "touch|goodix|novatek|nt36|focaltech|synaptics" >> touch_results.txt || true
          
          if [ -s touch_results.txt ]; then
            echo "[+] Touchscreen data found!"
            echo "--------------------------------------------------"
            cat touch_results.txt
            echo "--------------------------------------------------"
          else
            echo "[-] Auto-scan missed it. You will need to check the artifact manually."
          fi

      - name: Upload Device Tree Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pipa-Decompiled-Device-Tree
          path: |
            pipa-device-tree.dts
            touch_results.txt
