name: Build UEFI for Xiaomi Pad 6 (pipa)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-uefi:
    name: Compile UEFI for pipa
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # Crucial: This pulls in all the EDK2 source code

      - name: Install Build Dependencies
        run: |
          echo "Updating apt repositories..."
          sudo apt-get update -y
          
          echo "Installing EDK2 and ARM64 cross-compilation tools..."
          sudo apt-get install -y build-essential uuid-dev iasl git gcc-aarch64-linux-gnu \
                                  python3-distutils python3-pil python3-git bison flex \
                                  libssl-dev bc abootimg mtools dosfstools

      - name: Set up Toolchain Environment Variables
        run: |
          echo "Setting GCC5 paths for EDK2..."
          echo "GCC5_AARCH64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "PACKAGES_PATH=${{ github.workspace }}/edk2:${{ github.workspace }}/edk2-platforms:${{ github.workspace }}/edk2-msm" >> $GITHUB_ENV
          echo "WORKSPACE=${{ github.workspace }}/workspace" >> $GITHUB_ENV

      - name: Build UEFI Image
        run: |
          echo "Executing master build script for pipa..."
          # We will create this bash script next to handle the EDK2 build commands
          chmod +x ./build.sh
          ./build.sh pipa

      - name: Generate Release Tag
        id: tag
        run: echo "RELEASE_TAG=pipa-uefi-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Upload UEFI Boot Image to Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Pipa UEFI Build - ${{ env.RELEASE_TAG }}
          body: |
            Automated UEFI build for Xiaomi Pad 6 (pipa).
            **Flash command:** `fastboot flash boot boot-pipa.img`
          files: |
            workspace/Build/pipaPkg/DEBUG_GCC5/FV/boot-pipa.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
