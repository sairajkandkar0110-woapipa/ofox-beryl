name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/beryl'
        type: string
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'beryl'
        type: string
      RELEASE_TYPE:
        description: 'Specify your Release Type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - 'boot'
          - 'recovery'
          - 'vendorboot'

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_TYPE: 'eng'
    permissions:
      contents: write

    steps:
    - name: Checkout Root Repository
      uses: actions/checkout@v4

    - name: Clean-up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 cpio python3-pip ccache
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Enable CCache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-

    - name: Set-up Manifest & Sync
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        if [ -f .repo/manifests/remove-minimal.xml ]; then
          sed -i '/guava/d' .repo/manifests/remove-minimal.xml
          sed -i '/gflags/d' .repo/manifests/remove-minimal.xml
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) external/guava external/gflags
        else
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) external/guava external/gflags
        fi

    - name: Move Device Tree to Build Space
      run: |
        FOX_ROOT="${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        TARGET_PATH="${FOX_ROOT}/${{ inputs.DEVICE_PATH }}"
        mkdir -p "${TARGET_PATH}"

        echo "Copying repository tree files to build target..."
        rsync -av --exclude='.git' --exclude='.github' --exclude='OrangeFox' ./ "${TARGET_PATH}/"

        echo "Ensuring vendor/omni/config directory exists in build tree to prevent inheritance errors..."
        mkdir -p "${FOX_ROOT}/vendor/omni/config"
        if [ ! -f "${FOX_ROOT}/vendor/omni/config/common.mk" ]; then
          echo "# Fallback Omni common config" > "${FOX_ROOT}/vendor/omni/config/common.mk"
        fi

        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Sanitize Environment & Keep Crypto Intact
      run: |
        TARGET_PATH="${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}"
        cd "${TARGET_PATH}"

        find . -name "*.rc" -exec sed -i '/se_omapi/d' {} + || true
        find . -name "*.rc" -exec sed -i '/health-service/d' {} + || true
        find . -name "*.rc" -exec sed -i '/vendor.health-default/d' {} + || true

        find . -name "Android.mk" -o -name "Android.bp" | xargs grep -l "health-service.example" 2>/devnull | while read -r file; do
          sed -i '/health-service.example/d' "$file" || true
        done || true

        if [ -f "BoardConfig.mk" ]; then
          grep -q "TW_INCLUDE_CRYPTO" BoardConfig.mk || echo "TW_INCLUDE_CRYPTO := true" >> BoardConfig.mk
          grep -q "TW_INCLUDE_CRYPTO_FBE" BoardConfig.mk || echo "TW_INCLUDE_CRYPTO_FBE := true" >> BoardConfig.mk
          grep -q "BOARD_USES_METADATA_PARTITION" BoardConfig.mk || echo "BOARD_USES_METADATA_PARTITION := true" >> BoardConfig.mk
          grep -q "LOCAL_CXX_STL" BoardConfig.mk || echo "LOCAL_CXX_STL := c++_static" >> BoardConfig.mk
          grep -q "TW_HAS_MTP" BoardConfig.mk || echo "TW_HAS_MTP := true" >> BoardConfig.mk
        fi

        cd ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        find hardware/interfaces/health -name "*.rc" -exec sed -i '/vendor.health-default/d' {} + || true
        find system/core -name "*.rc" -exec sed -i '/vendor.health-default/d' {} + || true
        rm -rf hardware/interfaces/health/aidl/default || true

    - name: Building OrangeFox & adbd
      run: |
        export BUILD_BROKEN_SRC_DIR_IS_WRITABLE=true
        export CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        mkdir -p $CCACHE_DIR
        ccache -M 8G
        ccache -z
        
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_KEEP_DM_VERITY=1
        export FOX_DELETE_AROMAFM=1
        set -e

        echo "Building for ${{ inputs.MANIFEST_BRANCH }}..."
        
        # Dynamically cascades through modern Android AOSP targets
        lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-${{ env.BUILD_TYPE }} || \
        lunch twrp_${{ inputs.DEVICE_NAME }}-${{ env.BUILD_TYPE }}
        
        make clean
        mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        
        echo "CCache Statistics:"
        ccache -s

    - name: Check Build Outputs
      run: |
        echo "Searching for compiled images and zips..."
        find OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }} -type f \( -name "*.img" -o -name "*.zip" \)

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox/*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox/*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - ${{ inputs.RELEASE_TYPE }}
          * **Build Branch:** fox_${{ inputs.MANIFEST_BRANCH }}
          * **Device:** ${{ inputs.DEVICE_NAME }}
          * **Target:** `${{ inputs.BUILD_TARGET }}image`
          * **Commit:** Built from commit `${{ env.COMMIT_ID }}`
          
