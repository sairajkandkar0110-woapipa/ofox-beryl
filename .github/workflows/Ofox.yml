name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 14.1
        - 12.1
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/beryl'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'beryl'
      RELEASE_TYPE:
        description: 'Specify your Release Type'
        required: true
        default: 'Debug'
        type: choice
        options:
        - Release
        - Debug
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_TYPE: 'eng'
    permissions:
      contents: write
      
    steps:
    - name: Checkout Root Repository
      uses: actions/checkout@v4
              
    - name: Clean-up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16
      
    - name: Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 cpio python3-pip
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest & Sync
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}  
        
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        # Strip heavy, unnecessary dependencies for minimal recovery builds
        if [ -f .repo/manifests/remove-minimal.xml ]; then
          echo "Found remove-minimal.xml. Stripping unnecessary blocks..."
          sed -i '/guava/d' .repo/manifests/remove-minimal.xml
          sed -i '/gflags/d' .repo/manifests/remove-minimal.xml
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) external/guava external/gflags
        else
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) external/guava external/gflags
        fi

    - name: Move Local Device Tree to Build Space
      run: |
        TARGET_PATH="${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}"
        mkdir -p "${TARGET_PATH}"
        
        echo "Copying device tree files from root into build environment..."
        rsync -av --exclude='.git' --exclude='.github' --exclude='OrangeFox' ./ "${TARGET_PATH}/"
        
        cd "${TARGET_PATH}"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Sanitize Environment & Preserve Decryption
      run: |
        TARGET_PATH="${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}"
        cd "${TARGET_PATH}"
        
        echo "Removing broken health service triggers to prevent C++ linker aborts..."
        find . -name "*.rc" -exec sed -i '/se_omapi/d' {} + || true
        find . -name "*.rc" -exec sed -i '/health-service/d' {} + || true
        find . -name "*.rc" -exec sed -i '/vendor.health-default/d' {} + || true

        echo "Disabling conflicting health-service target blocks from Android.mk / Android.bp..."
        find . -name "Android.mk" -o -name "Android.bp" | xargs grep -l "health-service.example" 2>/devnull | while read -r file; do
          sed -i '/health-service.example/d' "$file" || true
        done || true

        echo "Ensuring ADB and FBE v2 Flags are properly mapped in BoardConfig.mk..."
        if [ -f "BoardConfig.mk" ]; then
          grep -q "TW_INCLUDE_CRYPTO" BoardConfig.mk || echo "TW_INCLUDE_CRYPTO := true" >> BoardConfig.mk
          grep -q "TW_INCLUDE_CRYPTO_FBE" BoardConfig.mk || echo "TW_INCLUDE_CRYPTO_FBE := true" >> BoardConfig.mk
          grep -q "BOARD_USES_METADATA_PARTITION" BoardConfig.mk || echo "BOARD_USES_METADATA_PARTITION := true" >> BoardConfig.mk
          grep -q "LOCAL_CXX_STL" BoardConfig.mk || echo "LOCAL_CXX_STL := c++_static" >> BoardConfig.mk
          
          # Force ADB support
          grep -q "TW_HAS_MTP" BoardConfig.mk || echo "TW_HAS_MTP := true" >> BoardConfig.mk
        fi

        # Globally remove health service from source tree to prevent build failures
        cd ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        find hardware/interfaces/health -name "*.rc" -exec sed -i '/vendor.health-default/d' {} + || true
        find system/core -name "*.rc" -exec sed -i '/vendor.health-default/d' {} + || true
        rm -rf hardware/interfaces/health/aidl/default || true

    - name: Building OrangeFox & adbd
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_KEEP_DM_VERITY=1
        export FOX_DELETE_AROMAFM=1
        set -e

        if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
          echo "Building for 14.1..."
          lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-${{ env.BUILD_TYPE }}
          make clean
          # Explicitly compile adbd alongside the vendorboot image
          mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        fi

        if [ "${{ inputs.MANIFEST_BRANCH }}" = "12.1" ]; then
          echo "Building for 12.1..."
          lunch twrp_${{ inputs.DEVICE_NAME }}-eng || lunch twrp_${{ inputs.DEVICE_NAME }}-userdebug
          make clean
          mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        fi

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - ${{ inputs.RELEASE_TYPE }}
          * **Build Branch:** fox_${{ inputs.MANIFEST_BRANCH }}
          * **Device:** ${{ inputs.DEVICE_NAME }}
          * **Target:** `${{ inputs.BUILD_TARGET }}image`
          * **Commit:** Built from commit `${{ env.COMMIT_ID }}`
          * **Features:** ADB enabled, FBE decryption (Keymint/Gatekeeper) preserved, Health-service linker fix applied.
          
