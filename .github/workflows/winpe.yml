name: Build Windows Image from ESD (Linux)

on:
  workflow_dispatch:
    inputs:
      esd_url:
        description: 'Direct Download URL for Windows ARM64 .esd file'
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install wimtools
        run: |
          sudo apt-get update
          sudo apt-get install -y wimtools

      - name: Download and Convert ESD
        run: |
          echo "Downloading ESD file..."
          wget -O input.esd "${{ github.event.inputs.esd_url }}"
          
          echo "Checking available indexes inside ESD..."
          wiminfo input.esd
          
          echo "Converting ESD index 1 to WIM format..."
          wimexport input.esd 1 output.wim --compress=maximum

      - name: Archive Processed Image
        run: |
          zip -9 xiaomi_pad6_windows.zip output.wim

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-linux-build-${{ github.run_number }}
          name: "Xiaomi Pad 6 Windows Image (Build #${{ github.run_number }})"
          body: "Processed via automated Linux GitHub Action using wimlib."
          files: xiaomi_pad6_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
