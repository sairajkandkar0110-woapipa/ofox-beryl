name: Build Windows Image to IMG (Linux)

on:
  workflow_dispatch:
    inputs:
      esd_url:
        description: 'Direct Download URL for Windows ARM64 .esd file'
        required: true

jobs:
  build-img:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install wimtools
        run: |
          sudo apt-get update
          sudo apt-get install -y wimtools

      - name: Download and Convert ESD to WIM
        run: |
          echo "Downloading ESD file..."
          wget -O input.esd "${{ github.event.inputs.esd_url }}"
          
          echo "Converting ESD index 1 to WIM..."
          wimexport input.esd 1 output.wim --compress=maximum

      - name: Prepare Final Image Asset
        run: |
          # Simply rename the WIM file to .img format safely without formatting blocks
          cp output.wim xiaomi_pad6_windows.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pad6-windows-img
          path: xiaomi_pad6_windows.img
          compression-level: 9
